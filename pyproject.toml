[project]
name = "spoken-entities-it"
version = "0.1.0"
description = "Do the details survive the phone? Italian codes, dates and numbers through TTS, a phone channel and speech recognition."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoken_entities"]

[tool.pytest.ini_options]
pythonpath = ["src"]
